name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # data/ is written only by the "Update data" workflow on main; a branch's test-run data must not merge over it
      # (handoff 265). Before merging: git checkout origin/main -- data
      - name: PRs leave data/ alone
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD -- data)
          if [ -n "$changed" ]; then echo "This PR changes data/ (run: git checkout origin/main -- data):"; echo "$changed"; exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
