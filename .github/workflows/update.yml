name: Update data

on:
  schedule:
    # GitHub delays or drops scheduled runs at the top of the hour (only 3 scheduled runs had ever fired by Oct 10, up to 3.5 hours
    # late, and the first 6 AM run never came), so runs sit off the hour and the morning one has two backups.
    - cron: "7 10 * * *"   # 6 AM ET (5 AM in winter): the morning page shows today, after ESPN's ~3 AM waiver run (findings 123)
    - cron: "41 10 * * *"  # morning backup
    - cron: "19 11 * * *"  # morning backup
    - cron: "13 13 * * *"  # 9 AM ET daily (8 AM in winter)
    - cron: "37 16 * * *"  # 12:30 PM ET (11:30 AM in winter): goalie starters confirmed after morning skates
    - cron: "9 21 * * *"   # 5 PM ET (4 PM in winter): last starter check before games
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # one queue per branch: a branch test run never cancels a waiting main run (handoff 468)
  group: update-data-${{ github.ref }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub runs scheduled backups late and in bunches (12:15, 12:25 and 12:41 PM on Oct 11): a backup has nothing new
      # to add once the latest ET slot's numbers are published (findings 210). Slots are computed in America/New_York, so
      # the UTC crons can't run ahead of a slot after the clock change (handoff 466), and the check reads current main,
      # not this run's own checkout, which may be older if the run waited in the queue (handoff 467).
      - name: Skip a backup run once the latest slot has published
        id: gate
        if: github.event_name == 'schedule'
        run: |
          git fetch -q origin main
          git show origin/main:data/players.json > /tmp/main-players.json || echo '{}' > /tmp/main-players.json
          skip=$(python3 scripts/slot_gate.py /tmp/main-players.json || echo false)
          if [ "$skip" = "true" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - run: pip install requests
        if: steps.gate.outputs.skip != 'true'
      # finished weeks of NHL stats, kept between runs (speed audit plan 3); each run saves a new copy that the next restores
      - uses: actions/cache@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          path: .nhl-cache
          key: nhl-stats-${{ github.run_id }}
          restore-keys: nhl-stats-
      - run: python scripts/fetch.py
        if: steps.gate.outputs.skip != 'true'
        env:
          NHL_CACHE: .nhl-cache
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
      # A bad ESPN answer stops here, so the site keeps the last good data
      - name: Check data
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/check_data.py --against-head
      - name: Commit data
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update player data"
          git pull --rebase
          git push
      # Publish fresh data even without ratings, then fail the run so GitHub emails the repo owner
      - name: Check Claude Rating
        if: steps.gate.outputs.skip != 'true'
        run: python scripts/check_data.py --require-rated
