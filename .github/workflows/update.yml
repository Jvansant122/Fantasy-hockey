name: Update data

on:
  schedule:
    # GitHub delays or drops scheduled runs at the top of the hour (only 3 scheduled runs had ever fired by Oct 10, up to 3.5 hours
    # late, and the first 6 AM run never came), so runs sit off the hour and the morning one has two backups.
    - cron: "7 10 * * *"   # 6 AM ET (5 AM in winter): the morning page shows today, after ESPN's ~3 AM waiver run (findings 123)
    - cron: "41 10 * * *"  # morning backup
    - cron: "19 11 * * *"  # morning backup
    - cron: "13 13 * * *"  # 9 AM ET daily (8 AM in winter)
    - cron: "37 16 * * *"  # 12:30 PM ET (11:30 AM in winter): goalie starters confirmed after morning skates
    - cron: "9 21 * * *"   # 5 PM ET (4 PM in winter): last starter check before games
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch.py
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
      # A bad ESPN answer stops here, so the site keeps the last good data
      - name: Check data
        run: python scripts/check_data.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update player data"
          git pull --rebase
          git push
      # Publish fresh data even without ratings, then fail the run so GitHub emails the repo owner
      - name: Check Claude Rating
        run: python scripts/check_data.py --require-rated
